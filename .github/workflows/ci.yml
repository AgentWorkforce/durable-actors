name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    python:
        uses: ./.github/workflows/python.yml

    image:
        name: Runtime images (${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: ubuntu-24.04
                    - arch: arm64
                      platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Docker builder
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
              with:
                  platforms: ${{ matrix.platform }}
            - name: Build control-plane image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  target: control-plane
                  platforms: ${{ matrix.platform }}
                  load: true
                  tags: durable-actors:ci-control-plane
            - name: Check the control-plane image runtime
              run: bash scripts/test-runtime-image.sh durable-actors:ci-control-plane "control-plane"

            - name: Build typescript image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  target: typescript
                  platforms: ${{ matrix.platform }}
                  load: true
                  tags: durable-actors:ci-typescript
            - name: Check the typescript image runtime
              run: bash scripts/test-runtime-image.sh durable-actors:ci-typescript "typescript"

            - name: Build python image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  target: python
                  platforms: ${{ matrix.platform }}
                  load: true
                  tags: durable-actors:ci-python
            - name: Check the python image runtime
              run: bash scripts/test-runtime-image.sh durable-actors:ci-python "python"

    rust:
        name: Rust runtime
        runs-on: ubuntu-24.04
        services:
            clickhouse:
                image: clickhouse/clickhouse-server:26.6
                env:
                    CLICKHOUSE_DB: trace_test
                    CLICKHOUSE_USER: trace_test
                    CLICKHOUSE_PASSWORD: local-test-only
                    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
                ports:
                    - 8123:8123
                options: >-
                    --health-cmd "wget -q -O - http://localhost:8123/ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: durable_actors_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d durable_actors_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7.2-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install Rust toolchain
              run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt && rustup default 1.91.0
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: validation-ubuntu-24.04
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - uses: ./.github/actions/setup-test-litestream
            - name: Check formatting
              run: cargo fmt --all -- --check
            - name: Run tests
              env:
                  DURABLE_ACTORS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/durable_actors_test?sslmode=disable
                  DURABLE_ACTORS_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
                  DURABLE_ACTORS_TEST_REDIS_URL: redis://127.0.0.1:6379
              run: cargo test --locked --no-fail-fast
            - run: bun install --frozen-lockfile
            - run: bun run --bun --cwd sdk build
            - name: Check packaged actors on Bun
              run: bun test --timeout 60000 sdk/tests/scripts/build-artifact.test.mjs sdk/tests/scripts/host-runtime.test.mjs
            - run: cargo build --locked
            - name: Run WebSocket and restart integration tests
              run: cargo test --locked -- --ignored
            - name: Check the Express and React example
              working-directory: examples/chat
              run: |
                  bun ../../sdk/dist/cli.js generate src/actors.ts
                  bun run build
            - name: Check the AI chat example
              working-directory: examples/ai-chat
              run: bun run build
            - name: Check the documents example
              working-directory: examples/documents
              run: |
                  bun ../../sdk/dist/cli.js generate src/actors.ts
                  bun run build

    npm:
        name: TypeScript package
        runs-on: ubuntu-24.04
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: bun install --frozen-lockfile
            - run: bun run --bun --cwd sdk format:check
            - run: bun run --bun --cwd packages/observer-ui format:check
            - run: bun run --bun --cwd sdk test
            - name: Validate HTTP and build TypeScript documentation
              run: bun run --bun docs:build
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: typescript-api
                  path: .artifacts/api
                  include-hidden-files: true
                  if-no-files-found: error
            - run: bun run --bun --cwd packages/observer-ui package:check
            - name: Verify npm package
              working-directory: sdk
              run: bun pm pack --dry-run

    helm:
        name: Kubernetes chart
        runs-on: ubuntu-24.04
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install Helm
              run: |
                  curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
                  curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
                  sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum
                  tar -xzf helm-v3.19.0-linux-amd64.tar.gz
                  sudo install linux-amd64/helm /usr/local/bin/helm
            - run: helm lint charts/durable-actors -f charts/durable-actors/tests/values.yaml
            - run: bun test --timeout 60000 charts/durable-actors/tests/chart.test.mjs tests/scripts/chart-image.test.mjs tests/scripts/python-release.test.mjs
            - run: helm package charts/durable-actors --destination .artifacts/charts
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: durable-actors-helm-chart
                  path: .artifacts/charts/*.tgz
                  include-hidden-files: true
                  if-no-files-found: error

    native:
        uses: ./.github/workflows/native-build.yml
