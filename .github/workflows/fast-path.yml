# Fast path: run the CI and release checks, publish the runtime images and
# build every release artifact on Blacksmith runners, without waiting for a
# GitHub release. Anyone with write access (people or agents) may start it;
# nothing runs until Khaliq approves the fast-path environment.
#
# What it publishes, and what it only builds:
# - Runtime images (control-plane, typescript, python) go to the same Artifact
#   Registry repository as release.yml, tagged fast-<sha>-<target> (and
#   fast-<sha>-<target>-<arch>). It never pushes a version or latest-* tag;
#   deployments pin the digests printed in the run summary. No GitHub
#   attestation is issued: it would name the dispatch commit, not the built ref.
# - npm, crates.io and PyPI are not published (npm and PyPI use trusted
#   publishing bound to release.yml). The npm tarballs, the .crate file, the
#   Python SDK and runtime wheels, the native runtime bundles and the Helm
#   chart are uploaded as workflow artifacts. The chart is not pushed.
# No dist-tag, image channel tag, chart version or GitHub release is created
# or moved.
name: fast-path
run-name: fast-path ${{ inputs.ref }} (${{ inputs.reason }})
on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag or commit to build (a PR branch is fine)
                required: true
                default: main
            reason:
                description: Why this needs the fast path
                required: true
permissions:
    contents: read
concurrency:
    group: fast-path-${{ inputs.ref }}
    cancel-in-progress: false
env:
    REGISTRY: us-central1-docker.pkg.dev
    IMAGE: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
jobs:
    gate:
        name: Approve and resolve ref
        environment: fast-path
        runs-on: blacksmith-2vcpu-ubuntu-2404
        outputs:
            sha: ${{ steps.sha.outputs.sha }}
            version: ${{ steps.sha.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false
            - id: sha
              run: |
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  echo "version=$(node -p 'require("./sdk/package.json").version')" >> "$GITHUB_OUTPUT"

    rust:
        name: Rust runtime
        needs: gate
        runs-on: blacksmith-4vcpu-ubuntu-2404
        services:
            clickhouse:
                image: clickhouse/clickhouse-server:26.6
                env:
                    CLICKHOUSE_DB: trace_test
                    CLICKHOUSE_USER: trace_test
                    CLICKHOUSE_PASSWORD: local-test-only
                    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
                ports:
                    - 8123:8123
                options: >-
                    --health-cmd "wget -q -O - http://localhost:8123/ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: durable_actors_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d durable_actors_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7.2-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.gate.outputs.sha }}
                  persist-credentials: false
            - name: Install Rust toolchain
              run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt && rustup default 1.91.0
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: validation-ubuntu-24.04
                  save-if: false
            - uses: ./.github/actions/setup-test-litestream
            - name: Check formatting
              run: cargo fmt --all -- --check
            - name: Run tests
              env:
                  DURABLE_ACTORS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/durable_actors_test?sslmode=disable
                  DURABLE_ACTORS_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
                  DURABLE_ACTORS_TEST_REDIS_URL: redis://127.0.0.1:6379
              run: cargo test --locked --no-fail-fast
            - name: Verify crate package
              run: cargo publish --locked --dry-run
            - run: bun install --frozen-lockfile
            - run: bun run --bun --cwd sdk build
            - name: Check packaged actors on Bun
              run: bun test --timeout 60000 sdk/tests/scripts/build-artifact.test.mjs sdk/tests/scripts/host-runtime.test.mjs
            - run: cargo build --locked
            - name: Run WebSocket and restart integration tests
              run: cargo test --locked -- --ignored
            - name: Check the Express and React example
              working-directory: examples/chat
              run: |
                  bun ../../sdk/dist/cli.js generate src/actors.ts
                  bun run build
            - name: Check the AI chat example
              working-directory: examples/ai-chat
              run: bun run build
            - name: Check the documents example
              working-directory: examples/documents
              run: |
                  bun ../../sdk/dist/cli.js generate src/actors.ts
                  bun run build
            - name: Package the crate
              run: cargo package --locked --no-verify
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: crate-${{ needs.gate.outputs.sha }}
                  path: target/package/*.crate
                  if-no-files-found: error

    npm:
        name: TypeScript package
        needs: gate
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.gate.outputs.sha }}
                  persist-credentials: false
            - run: bun install --frozen-lockfile
            - run: bun run --bun --cwd sdk format:check
            - run: bun run --bun --cwd packages/observer-ui format:check
            - run: bun run --bun --cwd sdk test
            - name: Validate HTTP and build TypeScript documentation
              run: bun run --bun docs:build
            - run: bun run --bun --cwd packages/observer-ui package:check
            - name: Check and pack the tested npm packages
              run: |
                  bun run --bun --cwd sdk package:check
                  bun pm --cwd packages/observer-ui pack --ignore-scripts --destination ../../dist-tarballs
                  bun pm --cwd sdk pack --ignore-scripts --destination ../dist-tarballs
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: npm-packages-${{ needs.gate.outputs.sha }}
                  path: dist-tarballs/*.tgz
                  if-no-files-found: error

    helm:
        name: Kubernetes chart
        needs: gate
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.gate.outputs.sha }}
                  persist-credentials: false
            - name: Install Helm
              run: |
                  curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
                  curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
                  sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum
                  tar -xzf helm-v3.19.0-linux-amd64.tar.gz
                  sudo install linux-amd64/helm /usr/local/bin/helm
            - run: helm lint charts/durable-actors -f charts/durable-actors/tests/values.yaml
            - run: bun test --timeout 60000 charts/durable-actors/tests/chart.test.mjs tests/scripts/chart-image.test.mjs tests/scripts/python-release.test.mjs
            - run: helm package charts/durable-actors --destination .artifacts/charts
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: helm-chart-${{ needs.gate.outputs.sha }}
                  path: .artifacts/charts/*.tgz
                  include-hidden-files: true
                  if-no-files-found: error

    python:
        name: Python ${{ matrix.python }}
        needs: gate
        runs-on: blacksmith-4vcpu-ubuntu-2404
        strategy:
            fail-fast: false
            matrix:
                python: ["3.11", "3.13", "3.14"]
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.gate.outputs.sha }}
                  persist-credentials: false
            - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
                  cache-dependency-glob: sdk-python/uv.lock
            - name: Install Rust toolchain
              run: rustup toolchain install 1.91.0 --profile minimal && rustup default 1.91.0
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: validation-ubuntu-24.04
                  save-if: false
            - name: Build native runtime
              run: cargo build --locked
            - name: Install Python dependencies
              working-directory: sdk-python
              run: uv sync --locked --all-extras --no-install-package durable-actors-runtime
            - name: Check source and generated client types
              working-directory: sdk-python
              run: |
                  uv run --no-sync ruff check src tests
                  uv run --no-sync ruff format --check src tests
                  uv run --no-sync mypy src/durable_actors
                  uv run --no-sync pyright
            - name: Test Python actors against the Rust runtime
              working-directory: sdk-python
              env:
                  DURABLE_ACTORS_TEST_RUNTIME: ${{ github.workspace }}/target/debug/durable-actors
              run: uv run --no-sync pytest -q
            - name: Check Bun CLI compatibility with Python projects
              env:
                  DURABLE_ACTORS_TEST_RUNTIME: ${{ github.workspace }}/target/debug/durable-actors
                  DURABLE_ACTORS_TEST_PYTHON: ${{ github.workspace }}/sdk-python/.venv/bin/python
              run: |
                  bun install --frozen-lockfile
                  bun run --bun --cwd sdk build
                  bun run --bun --cwd sdk tsc -p tsconfig.test.json
                  bun test --timeout 60000 ./sdk/.test-dist/tests/cli/python.test.js
            - name: Build distributions
              if: matrix.python == '3.13'
              working-directory: sdk-python
              run: |
                  uv build --no-sources
                  uv run --isolated --no-project --with ./dist/durable_actors-*.whl python - <<'PY'
                  import subprocess
                  import sys
                  from pathlib import Path
                  import durable_actors

                  assert Path(durable_actors.__file__).with_name("py.typed").is_file()
                  result = subprocess.run([sys.executable, "-m", "durable_actors", "--help"], capture_output=True, text=True)
                  assert result.returncode == 1, result
                  assert "Install durable-actors[cli]" in result.stderr, result.stderr
                  assert "Traceback" not in result.stderr, result.stderr
                  PY
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: matrix.python == '3.13'
              with:
                  name: python-sdk-${{ needs.gate.outputs.sha }}
                  path: sdk-python/dist/*
                  if-no-files-found: error

    # Same runners as native-build.yml. macOS Intel (GitHub-hosted only) is left out.
    native:
        name: Native runtime (${{ matrix.runner }})
        needs: [gate, npm]
        strategy:
            fail-fast: false
            matrix:
                runner: [blacksmith-4vcpu-ubuntu-2204, blacksmith-4vcpu-ubuntu-2204-arm, blacksmith-6vcpu-macos-15]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.gate.outputs.sha }}
                  persist-credentials: false
            - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
              with:
                  python-version: "3.11"
                  enable-cache: true
            - name: Install Rust toolchain
              run: rustup toolchain install 1.91.0 --profile minimal && rustup default 1.91.0
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: native-${{ matrix.runner }}
                  save-if: false
            - name: Build Rust runtime
              run: bun scripts/build-runtime.mjs
            - name: Check the native executable
              run: target/release/durable-actors --version
            - name: Build Python runtime wheel and observer assets
              shell: bash
              run: |
                  bun install --frozen-lockfile
                  bun run --bun --cwd packages/observer-ui build
                  mkdir -p python-runtime/durable_actors_runtime/observer
                  cp -R packages/observer-ui/dist/standalone/. python-runtime/durable_actors_runtime/observer/
                  uvx --from 'maturin>=1.15,<2' --with patchelf maturin build --release --out dist-python-runtime
                  uv build --wheel --no-sources sdk-python --out-dir dist-python-sdk
            - name: Install wheels and test Python-only workflows
              shell: bash
              env:
                  DURABLE_ACTORS_TEST_WHEEL: "1"
              run: |
                  uv venv .artifacts/python-cli --python 3.11
                  wheels=(dist-python-sdk/*.whl)
                  uv pip install --python .artifacts/python-cli/bin/python --find-links dist-python-runtime "${wheels[0]}[cli]" pytest pytest-asyncio
                  .artifacts/python-cli/bin/durable-actors --version
                  .artifacts/python-cli/bin/durable-actors-native --version
                  .artifacts/python-cli/bin/python -m pytest sdk-python/tests/test_cli.py -q
            # The check native-publish.yml runs before it uploads a native bundle.
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: npm-packages-${{ needs.gate.outputs.sha }}
                  path: .artifacts
            - name: Check the packaged SDK and native bundle
              env:
                  DURABLE_ACTORS_TEST_PACKAGE: ${{ github.workspace }}/.artifacts/durable-actors-${{ needs.gate.outputs.version }}.tgz
                  DURABLE_ACTORS_TEST_OBSERVER_PACKAGE: ${{ github.workspace }}/.artifacts/durable-actors-observer-${{ needs.gate.outputs.version }}.tgz
              run: |
                  bun test --timeout 60000 tests/scripts/build-runtime.test.mjs
                  bun pm pkg set "overrides.durable-actors-observer=file:$DURABLE_ACTORS_TEST_OBSERVER_PACKAGE"
                  bun add --cwd examples/chat --ignore-scripts "$DURABLE_ACTORS_TEST_PACKAGE"
                  bun run --bun --cwd examples/chat durable-actors generate src/actors.ts
                  bun run --bun --cwd examples/chat build
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: native-${{ matrix.runner }}-${{ needs.gate.outputs.sha }}
                  path: dist-runtime/*
                  if-no-files-found: error
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: python-runtime-${{ matrix.runner }}-${{ needs.gate.outputs.sha }}
                  path: dist-python-runtime/*.whl
                  if-no-files-found: error

    image-push:
        name: Runtime images (${{ matrix.arch }})
        needs: [gate, rust, npm, python]
        strategy:
            fail-fast: false
            matrix:
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: blacksmith-4vcpu-ubuntu-2404
                    - arch: arm64
                      platform: linux/arm64
                      runner: blacksmith-4vcpu-ubuntu-2404-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.gate.outputs.sha }}
                  persist-credentials: false
            - name: Set up Blacksmith Docker builder
              uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
              with:
                  cache-key: durable-actors/runtime-${{ matrix.arch }}
                  nofallback: true
                  platforms: ${{ matrix.platform }}
            - name: Build, check and push the images
              env:
                  SHA: ${{ needs.gate.outputs.sha }}
                  ARCH: ${{ matrix.arch }}
                  PLATFORM: ${{ matrix.platform }}
                  SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
              run: |
                  set -euo pipefail
                  for target in control-plane typescript python; do
                      tag="${IMAGE}:fast-${SHA}-${target}-${ARCH}"
                      docker buildx build . \
                        --target "$target" \
                        --platform "$PLATFORM" \
                        --load \
                        --tag "$tag" \
                        --label "org.opencontainers.image.source=${SOURCE_URL}" \
                        --label "org.opencontainers.image.revision=${SHA}" \
                        --label "org.opencontainers.image.licenses=MIT"
                      bash scripts/test-runtime-image.sh "$tag" "$target"
                  done
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  project_id: fluid-analogy-473415-c2
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
            - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker "$REGISTRY" --quiet
            - name: Push the validated images
              env:
                  SHA: ${{ needs.gate.outputs.sha }}
                  ARCH: ${{ matrix.arch }}
              run: |
                  set -euo pipefail
                  for target in control-plane typescript python; do
                      docker push "${IMAGE}:fast-${SHA}-${target}-${ARCH}"
                  done

    image:
        name: Publish runtime image manifests
        needs: [gate, image-push]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        outputs:
            control-plane-digest: ${{ steps.manifest.outputs.control-plane-digest }}
            typescript-digest: ${{ steps.manifest.outputs.typescript-digest }}
            python-digest: ${{ steps.manifest.outputs.python-digest }}
        steps:
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  project_id: fluid-analogy-473415-c2
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
            - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker "$REGISTRY" --quiet
            - name: Publish multi-platform manifests
              id: manifest
              env:
                  SHA: ${{ needs.gate.outputs.sha }}
              run: |
                  set -euo pipefail
                  for target in control-plane typescript python; do
                      docker buildx imagetools create \
                        --tag "${IMAGE}:fast-${SHA}-${target}" \
                        "${IMAGE}:fast-${SHA}-${target}-amd64" \
                        "${IMAGE}:fast-${SHA}-${target}-arm64"
                      inspection="$(docker buildx imagetools inspect "${IMAGE}:fast-${SHA}-${target}")"
                      digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$inspection")"
                      if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                          echo "::error::Could not resolve the published $target manifest digest"
                          exit 1
                      fi
                      echo "${target}-digest=${digest}" >> "$GITHUB_OUTPUT"
                  done
            - name: Summary
              env:
                  REF: ${{ inputs.ref }}
                  SHA: ${{ needs.gate.outputs.sha }}
                  REASON: ${{ inputs.reason }}
                  CONTROL_PLANE_DIGEST: ${{ steps.manifest.outputs.control-plane-digest }}
                  TYPESCRIPT_DIGEST: ${{ steps.manifest.outputs.typescript-digest }}
                  PYTHON_DIGEST: ${{ steps.manifest.outputs.python-digest }}
              run: |
                  {
                      echo "### durable-actors fast path: runtime images"
                      echo "- ref: \`$REF\` at \`$SHA\`"
                      echo "- reason: $REASON"
                      echo "- tag \`fast-$SHA-<target>\`:"
                      echo "  - \`${IMAGE}@${CONTROL_PLANE_DIGEST}\` (control-plane)"
                      echo "  - \`${IMAGE}@${TYPESCRIPT_DIGEST}\` (typescript)"
                      echo "  - \`${IMAGE}@${PYTHON_DIGEST}\` (python)"
                  } >> "$GITHUB_STEP_SUMMARY"

    summary:
        name: Summary
        needs: [gate, rust, npm, helm, python, native, image-push, image]
        if: always() && needs.gate.result == 'success'
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            - name: Summary
              env:
                  REF: ${{ inputs.ref }}
                  SHA: ${{ needs.gate.outputs.sha }}
                  REASON: ${{ inputs.reason }}
                  VERSION: ${{ needs.gate.outputs.version }}
                  RESULTS: ${{ toJSON(needs) }}
              run: |
                  {
                      echo "### durable-actors fast path"
                      echo "- ref: \`$REF\` at \`$SHA\` (manifest version $VERSION)"
                      echo "- reason: $REASON"
                      echo "- job results (artifacts exist only for jobs that succeeded):"
                      jq -r 'to_entries[] | "  - \(.key): \(.value.result)"' <<<"$RESULTS"
                      echo "- images: see the image job summary for digests (tag \`fast-$SHA-<target>\`)"
                      echo "- artifacts (nothing published to npm, crates.io or PyPI; chart not pushed):"
                      echo "  - \`npm-packages-$SHA\` (npm), \`crate-$SHA\` (rust), \`python-sdk-$SHA\` (python), \`helm-chart-$SHA\` (helm)"
                      echo "  - \`native-<runner>-$SHA\`, \`python-runtime-<runner>-$SHA\` (native)"
                  } >> "$GITHUB_STEP_SUMMARY"
